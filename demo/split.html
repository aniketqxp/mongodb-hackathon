<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Moves the Feed</title>
<style>
/* Tokens copied from ui/static/styles.css so both halves read as one product. */
:root {
  --bg: #0e0f11; --panel: #17181b; --panel-2: #1f2125; --ink: #f2f2f0; --muted: #9a9ca3; --line: #2a2c31;
  --accent: #e8e8e6; --accent-ink: #111214; --good: #5fcf8c; --good-bg: #173324; --bad: #ff8a75; --bad-bg: #3a201b;
  --warn: #e7b04a; --warn-bg: #3a3018; --radius: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100vh; }
.left { border: 0; width: 100%; height: 100%; background: var(--bg); }
.right { border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 8px; }

.rhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
.rtitle { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.flow { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.flow span { padding: 3px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); transition: color .2s, border-color .2s; }
.flow span.on { color: var(--ink); border-color: #4a4d55; }
.flow i { font-style: normal; opacity: .5; }
.reset { font-size: 13px; color: var(--muted); padding: 4px 0; }
.reset:hover { color: var(--ink); text-decoration: underline; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 14px; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.card h2 small { font-weight: 400; font-size: 12px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

/* said */
.quote { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { display: inline-flex; gap: 6px; align-items: baseline; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font-size: 13px; }
.slot b { font-weight: 400; color: var(--muted); font-size: 12px; }
.said-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); color: var(--ink); white-space: nowrap; }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }

/* memory */
.mem { display: flex; flex-direction: column; gap: 2px; }
.mrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) 92px auto; gap: 10px; align-items: center; padding: 2px 8px;
  border-radius: 10px; transition: background .2s; }
.mrow .ic { font-size: 18px; text-align: center; }
.mrow .mt { font-size: 14px; }
.mrow .mt small { display: block; color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); opacity: .7; border-radius: 3px; }
.mrow .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.mrow.gone .mt { color: var(--bad); text-decoration: line-through; }
.mrow.gone .bar i { background: var(--bad); }
.mrow.rule.boost { background: var(--warn-bg); }
.mrow.rule.block { background: var(--bad-bg); }
.mrow.rule .mt { font-weight: 600; }
.mrow.lit { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--good); }

/* feed order */
.cols { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1fr); gap: 12px; }
.cols.single { grid-template-columns: minmax(0, 1fr); }
.col h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
.frow { display: grid; grid-template-columns: 18px 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 2px 6px;
  border-radius: 8px; font-size: 14px; min-height: 25px; }
.frow .rk { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
.frow .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .why { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
.before .frow { color: var(--muted); }
.before .frow.dropped .ti { color: var(--bad); text-decoration: line-through; }
.mv { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
.mv.up { background: var(--good-bg); color: var(--good); }
.mv.down { background: var(--bad-bg); color: var(--bad); }
.mv.new { background: var(--good-bg); color: var(--good); }
.mv.same { color: var(--muted); font-weight: 400; }
.frow.boosted { box-shadow: inset 3px 0 0 var(--warn); }
.frow.new { box-shadow: inset 3px 0 0 var(--good); }
.frow.lit { background: var(--panel-2); outline: 1px solid #4a4d55; }
.note { margin-top: 8px; font-size: 13px; color: var(--muted); }
.note b { color: var(--ink); font-weight: 600; }

.arrive .frow, .arrive .mrow { animation: arrive .35s both ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .arrive .frow, .arrive .mrow { animation: none; } }

@media (max-width: 900px) {
  .split { grid-template-columns: 1fr; height: auto; }
  .left { height: 80vh; }
  .right { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="split">
  <iframe class="left" id="left" src="/left/" title="Parent feed"></iframe>

  <section class="right" aria-label="How memory moves the feed">
    <div class="rhead">
      <div class="rtitle" id="rtitle">How memory picks the feed</div>
      <div class="flow" aria-hidden="true"><span id="f1">Parent said</span><i>›</i><span id="f2">Memory</span><i>›</i><span id="f3">Feed order</span></div>
    </div>

    <div class="card" id="said" hidden>
      <h2><span>Parent said</span><small id="said-tag"></small></h2>
      <p class="quote" id="said-text"></p>
      <div class="slots" id="slots"></div>
      <div class="said-foot"><span id="said-src"></span><span id="said-sum"></span></div>
    </div>

    <div class="card" id="memory">
      <h2><span id="mem-h">Memory</span><small id="mem-sub"></small></h2>
      <div class="mem" id="mem"></div>
    </div>

    <div class="card" id="feed">
      <h2><span id="feed-h">Feed order</span><small id="feed-sub"></small></h2>
      <div class="cols single" id="cols"></div>
      <p class="note" id="feed-note" hidden></p>
    </div>

    <button class="reset" id="reset">Start over</button>
  </section>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Same topic icons as the feed on the left (ui/static/app.js).
const ICON = { animals: "🐙", space: "🚀", science: "🔬", music: "🎵", art_craft: "🎨", cooking: "🍳", gaming: "🎮",
  nature: "🌿", history: "🏛️", comedy: "😂", spooky: "👻", action: "💥" };
const word = (t) => String(t || "").replace("_", " & ");
const when = (iso) => iso ? new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";
let V = -1, LAST_EVENT = null;

function ruleWords(r) {
  const v = word(r.target.value);
  if (r.type === "prioritize") return { cls: "boost", icon: ICON[r.target.value] || "⬆️", text: `Show more ${v}`, sub: `parent rule · up to ${r.cap} at a time`, tag: ["warn", "Boost"] };
  if (r.type === "suppress") return { cls: "block", icon: ICON[r.target.value] || "⛔", text: `Hide ${v}`, sub: `parent rule · until ${when(r.expires_at)}`, tag: ["bad", "Block"] };
  return { cls: "", icon: "✕", text: `Forget ${v}`, sub: "parent rule", tag: ["bad", "Forget"] };
}

// ---------- stage 1: what the parent said, as the typed slots the compiler filled ----------
function renderSaid(s) {
  const said = s.said;
  $("#said").hidden = !said;
  if (!said) return;
  $("#said-text").textContent = said.by === "menu" ? "Don't recommend this" : `“${said.text}”`;
  const d = said.directive;
  const slots = [];
  if (d) {
    const act = { suppress: "Hide", prioritize: "Show more", retract: "Forget a memory" }[d.type] || d.type;
    slots.push(["Action", act]);
    slots.push([d.target.kind === "node" ? "Memory" : d.target.kind === "tag" ? "Tag" : "Topic",
      d.target.kind === "node" ? memText(s, d.target.value) : word(d.target.value)]);
    if (d.type === "prioritize") slots.push(["Max per feed", d.cap]);
    if (d.expires_at) slots.push(["Until", when(d.expires_at)]);
  }
  $("#slots").innerHTML = slots.map(([k, v]) => `<span class="slot"><b>${esc(k)}</b>${esc(v)}</span>`).join("")
    || `<span class="hint">${esc(said.reason || "")}</span>`;
  const tag = { draft: ["warn", "Waiting for Save rule"], saved: ["good", "Saved"], rejected: ["bad", "Not accepted"] }[said.status];
  $("#said-tag").innerHTML = tag ? `<span class="tag ${tag[0]}">${tag[1]}</span>` : "";
  $("#said-src").textContent = said.by === "menu" ? "From the ⋮ menu on a video" : `Slots filled by ${said.model}, checked by code against the pack`;
  $("#said-sum").textContent = "";
}

function memText(s, id) {
  const all = [...(s.memory || []), ...(s.memory_before || [])];
  return (all.find((m) => m.node_id === id) || {}).text || id;
}

// ---------- stage 2: memory (what the feed knows), with rules on top ----------
function renderMemory(s, focusSupports) {
  const changed = !!s.memory_before;
  const now = new Map(s.memory.map((m) => [m.node_id, m]));
  const before = changed ? s.memory_before : s.memory;
  const forgotten = changed ? before.filter((m) => !now.has(m.node_id)) : [];
  const rows = [...s.memory.map((m) => ({ ...m, gone: false })), ...forgotten.map((m) => ({ ...m, gone: true }))];
  const count = (id) => s.slate.filter((e) => e.supports.includes(id)).length;
  const prevRules = new Set((s.rules_before || s.rules).map((r) => r.directive_id));

  const ruleRows = s.rules.map((r) => {
    const w = ruleWords(r);
    const isNew = changed && !prevRules.has(r.directive_id);
    return `<div class="mrow rule ${w.cls}"><span class="ic">${w.icon}</span>
      <span class="mt">${esc(w.text)}<small>${esc(w.sub)}</small></span><span></span>
      <span class="num"><span class="tag ${w.tag[0]}">${isNew ? "New rule" : w.tag[1]}</span></span></div>`;
  }).join("");
  const memRows = rows.map((m) => `
    <div class="mrow ${m.gone ? "gone" : ""} ${focusSupports.has(m.node_id) ? "lit" : ""}">
      <span class="ic">${ICON[m.topic] || "•"}</span>
      <span class="mt">${esc(m.text)}<small>${m.gone ? "forgotten · no longer in search" : `from ${m.from_watches} watches · picks ${count(m.node_id)} in the feed`}</small></span>
      <span class="bar" title="match score from /memory/search"><i style="width:${Math.round(Math.max(0, Math.min(1, m.score)) * 100)}%"></i></span>
      <span class="num">${m.gone ? `<span class="tag bad">Forgotten</span>` : `${m.score.toFixed(2)} match`}</span>
    </div>`).join("");
  $("#mem").innerHTML = ruleRows + memRows;
  $("#mem-sub").textContent = "active memories from /memory/search";
}

// ---------- stage 3: feed order, before and after ----------
function because(s, e) {
  if (e.boosted_by) return `<span class="tag warn">rule</span>`;
  const icons = e.supports.map((id) => {
    const m = [...s.memory, ...(s.memory_before || [])].find((x) => x.node_id === id);
    return m ? (ICON[m.topic] || "•") : "•";
  });
  return icons.length ? `because ${icons.join(" ")}` : "";
}

function renderFeed(s, focus) {
  const after = s.slate;
  const before = s.slate_before;
  const cols = $("#cols");
  if (!before) {
    cols.className = "cols single";
    cols.innerHTML = `<div class="col">${after.map((e, i) => `
      <div class="frow ${e.status === "boosted" ? "boosted" : ""} ${e.video_id === focus ? "lit" : ""}">
        <span class="rk">${i + 1}</span><span>${ICON[e.topic] || "▶️"}</span>
        <span class="ti">${esc(e.title)}</span><span class="why">${because(s, e)}</span></div>`).join("")}</div>`;
    $("#feed-sub").textContent = "built by the harness from memory";
    return;
  }
  const bRank = new Map(before.map((e, i) => [e.video_id, i]));
  const aIds = new Set(after.map((e) => e.video_id));
  cols.className = "cols";
  cols.innerHTML = `
    <div class="col before"><h3>Before</h3>${before.map((e, i) => `
      <div class="frow ${aIds.has(e.video_id) ? "" : "dropped"}"><span class="rk">${i + 1}</span><span>${ICON[e.topic] || "▶️"}</span>
        <span class="ti">${esc(e.title)}</span><span class="why">${aIds.has(e.video_id) ? "" : `<span class="mv down">out</span>`}</span></div>`).join("")}</div>
    <div class="col after"><h3>After</h3>${after.map((e, i) => {
      const was = bRank.get(e.video_id);
      const mv = was === undefined ? `<span class="mv new">new</span>`
        : was > i ? `<span class="mv up">▲${was - i}</span>` : was < i ? `<span class="mv down">▼${i - was}</span>` : `<span class="mv same">=</span>`;
      return `<div class="frow ${e.status === "boosted" ? "boosted" : was === undefined ? "new" : ""} ${e.video_id === focus ? "lit" : ""}">
        <span class="rk">${i + 1}</span><span>${ICON[e.topic] || "▶️"}</span>
        <span class="ti">${esc(e.title)}</span><span class="why">${because(s, e)} ${mv}</span></div>`;
    }).join("")}</div>`;
  const out = before.filter((e) => !aIds.has(e.video_id)).length;
  const added = after.filter((e) => !bRank.has(e.video_id)).length;
  $("#feed-sub").textContent = `${out} out · ${added} in`;
}

function renderNote(s, focus) {
  const n = $("#feed-note");
  const e = focus && s.slate.find((x) => x.video_id === focus);
  if (e) {
    const why = e.boosted_by ? "a parent rule boosted it"
      : e.supports.map((id) => `“${memText(s, id)}”`).join(" and ");
    n.innerHTML = `<b>${esc(e.title)}</b> is here because of ${esc(why)}.`;
    n.hidden = false; return;
  }
  const blocked = (s.suppressed || []).length;
  if (s.event === "suppress" && blocked) { n.innerHTML = `Block runs before boost: <b>${blocked}</b> matching videos never became candidates.`; n.hidden = false; return; }
  if (s.event === "prioritize") { n.innerHTML = `Boosted videos go first, up to the cap; memory fills the rest.`; n.hidden = false; return; }
  if (s.event === "retract") { n.innerHTML = `Videos that only that memory supported are gone; ones with other support stay.`; n.hidden = false; return; }
  n.hidden = true;
}

function render(s) {
  const focus = s.focus;
  const fe = focus && s.slate.find((x) => x.video_id === focus);
  const focusSupports = new Set(fe ? fe.supports : []);
  renderSaid(s);
  renderMemory(s, focusSupports);
  renderFeed(s, focus);
  renderNote(s, focus);
  const changed = !!s.slate_before;
  $("#rtitle").textContent = focus ? "Why this video" : changed ? "What the change did" : s.said ? "Reading the request" : "How memory picks the feed";
  $("#f1").classList.toggle("on", !!s.said);
  $("#f2").classList.toggle("on", true);
  $("#f3").classList.toggle("on", true);
  $("#mem-h").textContent = changed ? "Memory, after the change" : "Memory";
  // One motion moment: rows arrive when a change lands.
  const key = `${s.event}:${changed}`;
  const fresh = changed && LAST_EVENT !== key;
  ["#mem", "#cols"].forEach((id) => { $(id).classList.toggle("arrive", fresh); });
  LAST_EVENT = key;
}

async function poll() {
  try {
    const s = await (await fetch("/demo/story")).json();
    if (s.v !== V && s.scope) { V = s.v; render(s); }
  } catch (_) { /* server restarting */ }
  setTimeout(poll, 500);
}
poll();

$("#reset").addEventListener("click", async () => {
  $("#reset").textContent = "Resetting…";
  await fetch("/demo/reset", { method: "POST" });
  $("#left").contentWindow.location.reload();
  $("#reset").textContent = "Start over";
});
</script>
</body>
</html>
