<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Governed Feed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Governed Feed</div>
    <div class="top-actions">
      <div class="kids" id="kid-pick" role="radiogroup" aria-label="Which child's feed"></div>
    </div>
  </header>

  <main class="feed-page">
    <div class="vlist" id="cards" aria-label="Recommended videos"></div>
    <div class="probe">
      <button class="link-btn" id="btn-probe">Try a restricted video</button>
    </div>
  </main>

  <!-- Bottom dock: rule check sheet, examples, and the prompt bar -->
  <div class="dock">
    <form id="directive-form" class="sheet" hidden>
      <div class="sheet-head">
        <strong>Check this rule</strong>
        <span class="tag" id="compiler-tag">manual</span>
        <button type="button" class="icon-btn small" id="btn-cancel" aria-label="Cancel">✕</button>
      </div>
      <p class="hint" id="compiler-note" hidden></p>
      <p class="plain" id="d-plain"></p>
      <div class="row">
        <label>Action
          <select id="d-type">
            <option value="suppress">Hide</option>
            <option value="prioritize">Show more</option>
            <option value="retract">Forget a memory</option>
          </select>
        </label>
        <label>Match by
          <select id="d-kind">
            <option value="topic">Topic</option>
            <option value="tag">Tag</option>
          </select>
        </label>
        <label>Which
          <input id="d-value" list="values" placeholder="e.g. spooky" autocomplete="off">
          <datalist id="values"></datalist>
        </label>
        <label id="wrap-exp">Until
          <input type="datetime-local" id="d-exp">
        </label>
        <label id="wrap-cap">Max per feed
          <input type="number" id="d-cap" min="1" max="10" value="2">
        </label>
      </div>
      <div class="row confirm-row">
        <button type="submit" class="primary">Save rule</button>
      </div>
    </form>

    <div class="examples" id="examples" aria-label="Examples">
      <button type="button" class="pill">No scary videos until Sunday</button>
      <button type="button" class="pill">More science videos</button>
      <button type="button" class="pill">No violent videos this week</button>
    </div>

    <form id="parent-form" class="composer">
      <input id="parent-text" autocomplete="off" aria-label="Tell the feed what your child should watch"
             placeholder="What should your child watch (or not)?">
      <button type="submit" class="send" aria-label="Set rule">→</button>
    </form>
  </div>

  <dialog id="changes-dialog">
    <form method="dialog" class="dialog-head">
      <h2>What changed</h2>
      <button class="icon-btn small" aria-label="Close">✕</button>
    </form>
    <div id="receipts" class="receipts"></div>
  </dialog>

  <dialog id="why-dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="why-title">Why this?</h2>
      <button class="icon-btn small" aria-label="Close">✕</button>
    </form>
    <div id="why-body"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
